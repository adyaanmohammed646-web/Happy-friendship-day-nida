<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FRIENDSHIP.EXE</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="stars"></div>

<!-- Boot Scene -->
<section id="bootScene" class="scene active">

<div class="logo">
FRIENDSHIP.EXE
</div>

<div class="terminal">
<div id="terminalText"></div>

<div class="progress">
<div id="progressBar"></div>
</div>

</div>

</section>

<!-- Intro Scene -->
<section id="introScene" class="scene">

<div class="glass">

<h1>
WELCOME,
<span>NIDA</span>
</h1>

<p id="aiMessage"></p>

<button id="continueBtn">
START MISSION
</button>

</div>

</section>

<!-- Mission Control -->
<section id="missionScene" class="scene">

<div class="glass missionBox">

<h1>🛰️ MISSION CONTROL</h1>

<p class="status">
Welcome back, <span>Captain Nida</span>
</p>

<div class="progressCard">

<h3>Mission Progress</h3>

<div class="progress">
<div id="missionProgress" style="width:0%"></div>
</div>

<p>0% Complete</p>

</div>

<div class="missions">

<button class="mission">
❤️ Mission 1<br>
Heart Hunter
</button>

<button class="mission" disabled>
⭐ Mission 2
</button>

<button class="mission" disabled>
🔐 Mission 3
</button>

<button class="mission" disabled>
🎁 Final Gift
</button>

</div>

</div>

</section>

<script src="script.js"></script>

</body>
  </html>
